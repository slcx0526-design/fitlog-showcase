name: FitLog
options:
  bundleIdPrefix: com.slcx0526
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "12.0.4"
targets:
  FitLog:
    type: application
    platform: iOS
    sources:
      - path: FitLog
        excludes:
          - Info.plist
          - FitLog.entitlements
    info:
      path: FitLog/Info.plist
    entitlements:
      path: FitLog/FitLog.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slcx0526.fitlog
        PRODUCT_NAME: FitLog
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
